name: tests

# Runs on every branch, deliberately.
#
# The previous trigger listed four branches -- develop, main, master, workos --
# and the branch this application is actually built on is not among them, so no
# push had ever run this workflow. A workflow that cannot be reached is
# indistinguishable from one that passes, which is the worse of the two states:
# the exit criterion "CI green" was being met by a workflow that had never run.
on:
  push:
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    # This application is database-per-tenant (DEC-1): every campaign a test
    # provisions is a real database created with CREATE DATABASE, so the suite
    # cannot run without a PostgreSQL server. There was no services: block
    # before, and .env.example sets DB_CONNECTION=sqlite -- measured rather than
    # assumed, by pointing the application at sqlite and running the supporter
    # isolation test, which fails outright.
    #
    # Pinned to the same image the local environment runs (compose.yaml uses
    # postgres:18-alpine), so a green run here means the engine that passed is
    # the engine the code was written against.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          # phpunit.xml pins DB_DATABASE to "testing"; the server must therefore
          # offer a database by that name for the central connection to reach.
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Real environment variables win over the .env file, because Laravel loads
    # it with Dotenv's immutable reader. That is what lets these override
    # .env.example's sqlite without editing the file after copying it.
    #
    # The POSTGRES_USER above is a superuser, which the tenancy package needs:
    # provisioning a campaign issues CREATE DATABASE.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      # Every suite except Browser, which needs a Chromium the three matrix legs
      # do not install. Excluded by name rather than left to fail: this job runs
      # three times, and installing a browser in each would download the same
      # ~650MB three times over for a result that cannot differ by PHP version.
      # The browser job below runs them once instead.
      - name: Tests
        run: php artisan test --exclude-testsuite=Browser

  # Browser tests, on one PHP version and in a job of their own.
  #
  # Separate from the matrix above because their cost and their failure modes
  # are different: they need a real browser, and the thing they exercise is
  # compiled JavaScript, which is identical whichever PHP built the page.
  #
  # This job is also the only place these tests run unattended. Locally they
  # need built assets that a developer has to produce, and the suite refuses to
  # run against a stale build (see Tests\Support\BuiltAssets) -- so CI, which
  # always builds from scratch and has no Vite dev server, is where they are
  # guaranteed to be honest.
  browser:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Not optional here, and not merely for speed. These tests read the build
      # output rather than a dev server, and refuse to run against assets older
      # than the sources they came from.
      - name: Build Assets
        run: npm run build

      # `--with-deps` installs the system libraries Chromium needs. The Sail
      # image already carries them; a bare GitHub runner is not guaranteed to,
      # and the failure without them is a browser that will not launch.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser Tests
        run: php artisan test --testsuite=Browser
