name: linter

# Same trigger correction as tests.yml: the previous four-branch list did not
# include the branch this application is built on, so this workflow had never
# run against the work it was meant to police.
on:
  push:
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

# Read, not write. The write permission existed for a commit step that was
# commented out; with this workflow checking rather than fixing, there is
# nothing for it to push and no reason to hold the capability.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      # Pinned rather than inherited from the runner image, so that the version
      # of Node deciding whether the frontend is correctly formatted does not
      # change underneath the project when GitHub updates its image.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      # `--no-scripts` was removed, and that is load-bearing rather than tidying.
      # It suppresses post-autoload-dump, which is where `package:discover`
      # runs -- and Laravel Wayfinder is auto-discovered (declared in its own
      # composer.json, absent from bootstrap/providers.php), so without
      # discovery the `wayfinder:generate` command below does not exist. This
      # is the install line from tests.yml, which passed on all three PHP
      # versions.
      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Copy Environment File
        run: cp .env.example .env

      # Wayfinder's output is gitignored, so a fresh checkout does not have it,
      # and three pages import from `@/actions/...` and `@/routes/...`. Without
      # these files ESLint's resolver cannot classify those imports as internal
      # and `import/order` then demands a different position -- 20 errors across
      # Index.vue, imports/Create.vue and imports/Show.vue. Measured by deleting
      # the directories locally and running the job's own commands.
      #
      # This is why the old workflow looked healthy: `npm run lint --fix`
      # reordered the imports, exited 0, and threw the result away.
      #
      # `--with-form` rather than bare `wayfinder:generate`: the bare form omits
      # the Vite plugin's `.form()` helpers, which the pages call at runtime.
      # Needs no database -- confirmed by running it against an unreachable host.
      - name: Generate Wayfinder Files
        run: php artisan wayfinder:generate --with-form

      # Every step below is the *checking* variant, and that is the whole point
      # of this file's existence rather than a preference.
      #
      # These three previously ran `composer lint`, `npm run format` and
      # `npm run lint` -- the variants that rewrite files in place. Pint would
      # reformat, Prettier would rewrite, ESLint would apply --fix, all three
      # would exit 0 having repaired whatever was wrong, and the repairs were
      # discarded with the runner because the commit step that would have saved
      # them is deleted. The workflow therefore reported success on every input
      # it was ever given: it could not fail, so a green tick here meant nothing
      # at all. A check that cannot fail is worse than an absent one, because
      # it is counted.
      - name: Check PHP Code Style
        run: composer lint:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check
